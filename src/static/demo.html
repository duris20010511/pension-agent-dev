<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연금 Agent 시연</title>
<!--
  본선 시연 화면 — 한 파일, 외부 CDN 없음, 바닐라 JS.
  서버(src/server.py)가 /demo 로 이 파일을 내고, 같은 주소의 API 를 부른다.
  · 상담           POST /chat · POST /session
  · 알림 미리받기  GET /alerts/profiles · POST /alerts · GET /alerts/outbox
  · DIY 설계       POST /diy
  · 규칙·온톨로지  GET /rules · GET /ontology
  왜 이렇게 —
  · 답변은 모델이 쓴 마크다운이라 태그가 섞일 수 있다(예선 답 200개 중 10개에 <br>). 그래서 렌더러를 직접 쓰고
    **모든 입력을 먼저 HTML 이스케이프한 뒤** 제목·굵게·목록·표·코드만 태그로 바꾼다. 태그는 글자로 보인다.
  · 서버 응답의 글자는 textContent 로만 넣는다. innerHTML 은 md() 결과에만 쓴다(h() 의 md 속성).
  · 숫자 규칙은 서버(taxcalc)에만 있다. 이 화면은 계산하지 않고 받은 값을 보여주기만 한다
    (won() 은 슬라이더 표기용으로 taxcalc.won 과 같은 모양만 맞춘다).
  · 서버 없이 파일로 열어도 깨지지 않게, 요청이 실패하면 '서버 연결 안 됨'만 표시한다.
  개발용 점검: 콘솔에서 __selftest() — 렌더러·카드·그래프 배치를 네트워크 없이 검사해 'N/N 통과'를 찍는다.
  주소 끝에 ?selftest=1 을 붙이면 열자마자 돌리고 결과를 화면 아래에 띄운다.
-->
<style>
:root {
  --orange: #F58220; --orange-d: #d4690a; --orange-soft: #fff3e8;
  --navy: #043B72; --navy-d: #022a52; --navy-soft: #e9f0f8;
  --ink: #16202c; --muted: #5a6577; --line: #dde3eb; --bg: #f3f5f8; --card: #ffffff;
  --ok: #2b8a3e; --ok-soft: #e7f5ea;
  --warn: #d4690a; --warn-soft: #fff3e8;
  --bad: #c92a2a; --bad-soft: #fdecec;
  --sev-high: #c92a2a; --sev-high-soft: #fdecec;
  --sev-mid: #d4690a; --sev-mid-soft: #fff3e8;
  --sev-info: #043B72; --sev-info-soft: #e9f0f8;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(4, 59, 114, .06), 0 4px 14px rgba(4, 59, 114, .06);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  font-size: 17px; line-height: 1.55;
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid rgba(245, 130, 32, .55); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ---------- 머리줄·탭 ---------- */
header.top {
  flex: none; height: 60px; background: var(--navy); color: #fff;
  display: flex; align-items: stretch; padding: 0 20px; gap: 22px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; white-space: nowrap; }
.brand .logo {
  width: 32px; height: 32px; border-radius: 9px; background: var(--orange);
  display: grid; place-items: center; font-size: 17px; color: #fff;
}
.brand small { font-weight: 500; font-size: 13px; color: #a9bdd6; }
nav.tabs { display: flex; gap: 2px; }
nav.tabs button {
  background: none; border: 0; color: #b9cbe0; font-size: 17px; font-weight: 700;
  padding: 0 16px; border-bottom: 4px solid transparent; border-top: 4px solid transparent; white-space: nowrap;
}
nav.tabs button:hover { color: #fff; }
nav.tabs button.on { color: #fff; border-bottom-color: var(--orange); }
nav.tabs .k { font-size: 12px; color: var(--orange); margin-right: 6px; }
.server { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #cfdbea; white-space: nowrap; }
.server .dot { width: 10px; height: 10px; border-radius: 50%; background: #8a96a8; }
.server.ok .dot { background: #51cf66; }
.server.bad .dot { background: #ff6b6b; }
.server.bad { color: #ffd6d6; font-weight: 700; }

main { flex: 1; min-height: 0; position: relative; }
section.tab { position: absolute; inset: 0; display: none; }
section.tab.on { display: flex; }

/* ---------- 공통 조각 ---------- */
.panel-title { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 15px; font-weight: 800; color: var(--navy); }
.panel-title .bar { width: 4px; height: 16px; border-radius: 2px; background: var(--orange); }
.btn {
  border: 2px solid var(--navy); background: #fff; color: var(--navy); border-radius: 10px;
  padding: 7px 14px; font-weight: 700; font-size: 15px;
}
.btn:hover:not(:disabled) { background: var(--navy-soft); }
.btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--orange-d); border-color: var(--orange-d); }
.btn.navy { background: var(--navy); color: #fff; }
.btn.navy:hover:not(:disabled) { background: var(--navy-d); }
.btn.small { padding: 4px 10px; font-size: 14px; border-width: 1.5px; }
.empty { color: var(--muted); font-size: 15px; }
.offline {
  display: inline-flex; align-items: center; gap: 8px; color: var(--bad); background: var(--bad-soft);
  border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 15px;
}
.offline::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
.rchip {
  display: inline-flex; align-items: baseline; gap: 6px; border: 1.5px solid var(--navy); color: var(--navy);
  background: #fff; border-radius: 8px; padding: 2px 9px; font-size: 14px; font-weight: 800; margin: 0 6px 6px 0;
}
.rchip .nm { font-weight: 500; color: var(--ink); font-size: 13px; }
.rchip:hover { background: var(--navy-soft); }
.dchip {
  display: inline-block; border-radius: 8px; padding: 2px 9px; font-size: 13px; margin: 0 6px 6px 0;
  background: var(--bg); color: var(--muted); font-weight: 600;
}
.tag { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 1px 7px; vertical-align: 1px; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.info { background: var(--navy-soft); color: var(--navy); }

/* ---------- 마크다운 ---------- */
.md { font-size: 16px; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .65em; }
.md h3, .md h4, .md h5, .md h6 { margin: .9em 0 .4em; color: var(--navy); line-height: 1.35; }
.md h3 { font-size: 19px; } .md h4 { font-size: 17px; } .md h5, .md h6 { font-size: 16px; }
.md strong { font-weight: 800; color: var(--navy-d); }
.md ul, .md ol { margin: 0 0 .65em; padding-left: 1.35em; }
.md li { margin: .15em 0; }
.md li::marker { color: var(--orange); font-weight: 800; }
.md code { font-family: Consolas, "D2Coding", monospace; font-size: .92em; background: #eef1f5; border-radius: 5px; padding: 1px 5px; }
.md pre { background: #0f1b2b; color: #e6edf6; border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 0 0 .7em; }
.md pre code { background: none; padding: 0; color: inherit; white-space: pre; }
.md blockquote { margin: 0 0 .7em; padding: 6px 12px; border-left: 4px solid var(--orange); background: var(--orange-soft); border-radius: 0 8px 8px 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: .8em 0; }
.md .tbl { overflow-x: auto; margin: 0 0 .7em; }
.md table { border-collapse: collapse; font-size: 15px; min-width: 60%; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--navy-soft); color: var(--navy); font-weight: 800; white-space: nowrap; }
.md td { font-variant-numeric: tabular-nums; }

/* ---------- 1. 상담 ---------- */
.chat-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.log { flex: 1; overflow-y: auto; padding: 18px 24px 8px; scroll-behavior: smooth; position: relative; }
.welcome { max-width: 760px; margin: 24px auto; text-align: center; }
.welcome h2 { margin: 0 0 6px; font-size: 26px; color: var(--navy); }
.welcome p { margin: 0; color: var(--muted); }
.welcome .four { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.welcome .four span { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; font-weight: 700; color: var(--navy); }
.welcome .four b { color: var(--orange); margin-right: 6px; }
.msg-user { display: flex; justify-content: flex-end; margin: 6px 0 12px; }
.msg-user .bubble {
  background: var(--navy); color: #fff; border-radius: 16px 16px 4px 16px; padding: 10px 16px;
  max-width: 78%; white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg-bot { margin: 0 0 22px; border-radius: 16px; padding: 4px; border: 2px solid transparent; cursor: default; }
.msg-bot.sel { border-color: rgba(245, 130, 32, .35); background: rgba(245, 130, 32, .03); }
.bot-head { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); margin: 0 4px 8px; flex-wrap: wrap; }
.avatar { width: 28px; height: 28px; border-radius: 8px; background: var(--orange); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.bot-head .who { font-weight: 800; color: var(--ink); }
.pill { border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 13px; }
.pill.time { background: var(--navy-soft); color: var(--navy); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.cards { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; box-shadow: var(--shadow); }
.card.result { grid-column: 1 / -1; border-left: 6px solid var(--orange); }
.card h4 { margin: 0 0 8px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; font-weight: 800; }
.card h4 .n { background: var(--navy); color: #fff; border-radius: 6px; width: 22px; height: 22px; display: grid; place-items: center; font-size: 13px; }
.card.result .md { font-size: 17px; }
.card ul.plain { list-style: none; margin: 0; padding: 0; font-size: 15px; }
.card ul.plain li { padding: 5px 0; border-bottom: 1px dashed var(--line); }
.card ul.plain li:last-child { border-bottom: 0; }
.ev .ev-n { color: var(--orange); font-weight: 800; margin-right: 6px; }
.ev .ev-title { font-weight: 700; }
.ev .ev-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.ev .ev-rules { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.as li::before { content: "가정"; font-size: 11px; font-weight: 800; color: var(--navy); background: var(--navy-soft); border-radius: 5px; padding: 1px 6px; margin-right: 7px; vertical-align: 1px; }
.as li.need::before { content: "필요"; color: var(--warn); background: var(--warn-soft); }
.next { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.act { text-align: left; border: 1.5px solid var(--navy); background: #fff; color: var(--navy); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 15px; }
.act:hover:not(:disabled) { background: var(--navy-soft); }
.act .kd { font-size: 11px; font-weight: 800; color: #fff; background: var(--navy); border-radius: 5px; padding: 1px 6px; margin-right: 7px; vertical-align: 1px; }
.act.k-diy .kd { background: var(--orange); }
.act.k-handoff { border-color: var(--ok); color: var(--ok); }
.act.k-handoff .kd { background: var(--ok); }
.act.k-guide { border-style: dashed; }
.act.k-guide .kd { background: var(--muted); }
.act.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
/* MAPS 경로 안내 — 연동이 아니라 경로만 알려 준다는 걸 점선·회색으로 */
.guidenote { margin: 4px auto 16px; max-width: 640px; border: 1.5px dashed var(--muted); border-radius: 12px; background: #fff; padding: 10px 14px; font-size: 14px; color: var(--ink); }
.guidenote b { color: var(--navy); }
/* 상담 요약 — 상담 때 보여 줄 한 장(전송 연동 아님) */
.handoff-card { margin: 4px auto 16px; max-width: 640px; border: 1.5px solid var(--ok); border-radius: 12px; background: #fff; overflow: hidden; }
.handoff-card .hc-head { background: var(--ok-soft); color: var(--ok); font-weight: 800; padding: 8px 14px; font-size: 15px; }
.handoff-card dl { display: grid; grid-template-columns: 7.5em 1fr; gap: 4px 10px; margin: 0; padding: 10px 14px; font-size: 14px; }
.handoff-card dt { color: var(--muted); font-weight: 700; }
.handoff-card dd { margin: 0; overflow-wrap: anywhere; }
.handoff-card .hc-foot { border-top: 1px solid var(--line); padding: 8px 14px; font-size: 13px; color: var(--muted); }
.acts .act { padding: 4px 10px; font-size: 14px; }
details.full { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
details.full summary { cursor: pointer; color: var(--navy); font-weight: 700; font-size: 14px; }
details.full .md { margin-top: 8px; font-size: 15px; }
.pending .card.result { display: flex; align-items: center; gap: 14px; color: var(--muted); }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--orange-soft); border-top-color: var(--orange); animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.err-block { margin: 0 0 18px; }
.sysnote { text-align: center; margin: 4px 0 16px; }
.sysnote span { display: inline-block; background: var(--ok-soft); color: var(--ok); font-weight: 700; font-size: 14px; border-radius: 999px; padding: 4px 14px; }

.mode-col { display: flex; flex-direction: column; gap: 6px; }
.mode select { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: inherit; }
.composer { flex: none; border-top: 1px solid var(--line); background: #fff; padding: 10px 24px 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chip-q {
  border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 13px; font-size: 14px; color: var(--ink);
  max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip-q b { color: var(--orange); margin-right: 5px; }
.chip-q:hover:not(:disabled) { border-color: var(--orange); background: var(--orange-soft); }
.input-row { display: flex; gap: 10px; align-items: stretch; }
.input-row textarea {
  flex: 1; resize: none; font-size: 17px; border: 2px solid var(--line); border-radius: 12px; padding: 11px 14px; height: 52px; line-height: 1.4;
}
.input-row textarea:focus { border-color: var(--orange); outline: none; }
.input-row .btn { padding: 0 22px; font-size: 17px; }

.side { width: 370px; flex: none; border-left: 1px solid var(--line); background: #fff; overflow-y: auto; padding: 16px 18px 24px; }
.side .blk { margin-bottom: 20px; }
.side .sess { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 14px; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: st; }
.steps li { position: relative; padding: 0 0 12px 34px; counter-increment: st; opacity: 0; animation: stepin .35s ease forwards; }
.steps li::before {
  content: counter(st); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--navy); color: #fff; font-size: 13px; font-weight: 800; display: grid; place-items: center;
}
.steps li::after { content: ""; position: absolute; left: 11px; top: 26px; bottom: 2px; width: 2px; background: var(--navy-soft); }
.steps li:last-child::after { display: none; }
.steps .st { font-weight: 800; font-size: 15px; }
.steps .dt { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.steps.wait li { animation: pulse 1.4s ease-in-out infinite; opacity: .5; }
.steps.wait li::before { background: #b8c4d3; }
.steps li.live-now::before { background: #b8c4d3; }
.steps li.live-now .st { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; }
.spinner.mini { width: 14px; height: 14px; border-width: 2px; }
@keyframes stepin { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 50% { opacity: .2; } }
.figs-mini { display: flex; flex-wrap: wrap; gap: 6px; }
.figs-mini span { background: var(--orange-soft); color: var(--orange-d); font-weight: 800; border-radius: 8px; padding: 2px 9px; font-size: 14px; }
.verify { border-radius: 12px; padding: 12px 14px; background: var(--ok-soft); }
.verify.warn { background: var(--warn-soft); }
.verify.bad { background: var(--bad-soft); }
.verify .big { font-size: 26px; font-weight: 800; color: var(--ok); line-height: 1.2; }
.verify.warn .big { color: var(--warn); }
.verify.bad .big { color: var(--bad); }
.verify .act { font-weight: 800; font-size: 15px; }
.verify ul { margin: 8px 0 0; padding-left: 1.1em; font-size: 14px; }
details.trace summary { cursor: pointer; font-weight: 700; color: var(--navy); font-size: 14px; }
details.trace pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; background: var(--bg); border-radius: 8px; padding: 10px; max-height: 320px; overflow-y: auto; margin: 8px 0 0; font-family: Consolas, "D2Coding", monospace; }

/* ---------- 2. 알림 미리받기 ---------- */
#tab-alerts, #tab-rules { flex-direction: column; }
.toolbar { flex: none; display: flex; gap: 14px; align-items: flex-end; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
.field select, .field input[type=date], .field input[type=number], .field input[type=text] {
  font-size: 16px; padding: 7px 10px; border: 2px solid var(--line); border-radius: 10px; background: #fff; height: 42px;
}
.field select:focus, .field input:focus { border-color: var(--orange); outline: none; }
.toolbar .psum { flex: 1 1 260px; font-size: 15px; color: var(--muted); align-self: center; min-width: 0; }
.alerts-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; padding: 16px 24px; }
.alerts-body > div { overflow-y: auto; min-height: 0; padding-right: 4px; }
.sumline { font-size: 15px; color: var(--muted); margin: 0 0 10px; }
.alert {
  --sev: var(--sev-info); --sev-soft: var(--sev-info-soft);
  background: #fff; border: 1px solid var(--line); border-left: 6px solid var(--sev); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); transition: box-shadow .3s, transform .3s;
}
.alert.sev-high { --sev: var(--sev-high); --sev-soft: var(--sev-high-soft); }
.alert.sev-mid { --sev: var(--sev-mid); --sev-soft: var(--sev-mid-soft); }
.alert.flash { box-shadow: 0 0 0 4px rgba(245, 130, 32, .45); }
.alert .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.alert .sev { background: var(--sev-soft); color: var(--sev); font-weight: 800; border-radius: 6px; padding: 2px 9px; font-size: 13px; }
.alert .when { margin-left: auto; font-weight: 700; color: var(--ink); }
.alert h3 { margin: 6px 0 6px; font-size: 19px; line-height: 1.35; }
.alert .md { font-size: 16px; }
.figs { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.fig { background: var(--bg); border-radius: 10px; padding: 6px 12px; min-width: 0; }
.fig .k { font-size: 12px; color: var(--muted); font-weight: 700; }
.fig .v { font-weight: 800; font-size: 18px; color: var(--navy); font-variant-numeric: tabular-nums; }
.alert .foot { display: flex; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.alert .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.report { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.report-wrap .rhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }

/* 휴대폰 알림처럼 위에서 내려오는 push */
#push-wrap { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: 440px; max-width: calc(100vw - 32px); z-index: 60; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.push {
  pointer-events: auto; cursor: pointer; background: rgba(255, 255, 255, .97); border-radius: 20px;
  box-shadow: 0 14px 34px rgba(2, 42, 82, .28), 0 0 0 1px rgba(2, 42, 82, .06);
  padding: 12px 16px 12px 12px; display: grid; grid-template-columns: 42px 1fr; gap: 12px;
  animation: drop .55s cubic-bezier(.2, .9, .3, 1.15) both; border-left: 5px solid var(--sev, var(--navy));
}
.push.sev-high { --sev: var(--sev-high); }
.push.sev-mid { --sev: var(--sev-mid); }
.push.out { animation: rise .35s ease forwards; }
.push .ic { width: 42px; height: 42px; border-radius: 11px; background: var(--orange); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; }
.push .app { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.push .app b { color: var(--ink); }
.push .ttl { font-weight: 800; font-size: 16px; line-height: 1.35; margin-top: 1px; }
.push .msg { font-size: 14px; color: #3b4656; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@keyframes drop { from { transform: translateY(-160%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { to { transform: translateY(-160%); opacity: 0; } }
#snack { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 30px); opacity: 0; visibility: hidden; pointer-events: none; background: var(--navy-d); color: #fff; padding: 10px 20px; border-radius: 12px; font-weight: 700; z-index: 70; transition: transform .3s, opacity .3s, visibility .3s; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
#snack.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

/* ---------- 3. DIY ---------- */
.diy-form { width: 440px; flex: none; overflow-y: auto; background: #fff; border-right: 1px solid var(--line); padding: 16px 20px 24px; }
.diy-out { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 24px 24px; }
.diy-qa { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 16px; }
.diy-qrow { display: flex; gap: 8px; }
.diy-qrow .diy-q { flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 15px; }
.diy-qrow .diy-q:focus { outline: none; border-color: var(--navy); }
.diy-qa .hint { font-size: 13px; color: var(--muted); margin: 6px 0 10px; }
.diy-turn { margin: 0 0 18px; }
.diy-turn .diy-ctx { font-size: 12px; color: var(--muted); text-align: right; margin: -4px 0 8px; }
.frow { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 12px; flex-wrap: wrap; }
.frow .field { flex: 1 1 0; min-width: 0; }
.frow .field input, .frow .field select { width: 100%; }
.unit { font-size: 13px; color: var(--muted); }
.combo { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.combo .ch { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.combo .ch input { flex: 1 1 auto; min-width: 0; max-width: 190px; font-weight: 800; border: 1.5px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: 15px; }
.combo .ch .sum { margin-left: auto; font-size: 14px; color: var(--muted); }
.combo .ch .sum b { color: var(--ink); }
.combo .ch .x { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 0 4px; }
.srow { display: grid; grid-template-columns: 64px 1fr 94px; align-items: center; gap: 8px; font-size: 14px; }
.srow input[type=range] { width: 100%; accent-color: var(--orange); }
.srow .val { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.sec-h { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; }
.sec-h label { font-weight: 800; color: var(--navy); display: flex; gap: 8px; align-items: center; }
.sec-h input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--orange); }
details.adv { margin: 4px 0 10px; }
details.adv summary { cursor: pointer; font-size: 14px; color: var(--navy); font-weight: 700; }
.credit-line { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
.diy-go { width: 100%; margin-top: 8px; padding: 11px; font-size: 17px; position: sticky; bottom: 0; box-shadow: 0 -8px 14px #fff; }
.cmp { border-collapse: separate; border-spacing: 0; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); font-size: 16px; }
.cmp th, .cmp td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.cmp tr:last-child td, .cmp tr:last-child th { border-bottom: 0; }
.cmp thead th { background: var(--navy); color: #fff; font-size: 17px; text-align: center; }
.cmp tbody th { text-align: left; color: var(--muted); font-weight: 700; background: #fafbfc; white-space: nowrap; }
.cmp td.hl { font-weight: 800; color: var(--navy); font-size: 18px; }
.cmp td.warnc { color: var(--warn); font-weight: 700; }
.wrapx { overflow-x: auto; margin-bottom: 18px; }
.yr { border-collapse: collapse; width: 100%; background: #fff; font-size: 15px; border: 1px solid var(--line); }
.yr th, .yr td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.yr th { background: var(--navy-soft); color: var(--navy); position: sticky; top: 0; }
.yr td:first-child, .yr th:first-child { text-align: center; }
.yr tr.flag td { background: var(--warn-soft); }
.boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.box { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.box.warnbox { border-color: #f5c08f; background: var(--warn-soft); }
.box ul { margin: 0; padding-left: 1.1em; font-size: 15px; }
.box .md { font-size: 15px; }
.lead { font-size: 18px; font-weight: 700; margin: 0 0 14px; }

/* ---------- 4. 규칙·온톨로지 ---------- */
.seg { display: inline-flex; border: 2px solid var(--navy); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: #fff; color: var(--navy); font-weight: 800; padding: 7px 18px; font-size: 15px; }
.seg button.on { background: var(--navy); color: #fff; }
.rview { flex: 1; min-height: 0; display: none; }
.rview.on { display: flex; }
.rules-wrap { flex: 1; overflow: auto; padding: 14px 24px 24px; }
table.rules { border-collapse: separate; border-spacing: 0; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); font-size: 15px; }
table.rules th, table.rules td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.rules thead th { background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 1; font-size: 15px; }
table.rules thead th:first-child { border-top-left-radius: var(--radius); }
table.rules thead th:last-child { border-top-right-radius: var(--radius); }
table.rules tr.flash td { background: var(--orange-soft); }
table.rules td.rid { font-weight: 800; color: var(--orange-d); white-space: nowrap; }
table.rules td.nm { font-weight: 800; white-space: nowrap; }
.how { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.how.calc { background: var(--orange-soft); color: var(--orange-d); }
.how.judge { background: var(--navy-soft); color: var(--navy); }
.how.only { background: #eef0f3; color: var(--muted); }
.quote { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 0 0 6px; font-size: 14px; color: #34404f; white-space: pre-line; overflow-wrap: anywhere; }
.quote .src { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--navy); font-weight: 700; }
.quote .src .aud { font-weight: 800; }
.quote .src .did { font-weight: 500; margin-left: 4px; }
/* 세금 지도 — 재원 × 인출 방식 9칸(계산 엔진이 쓰는 표) + 생애주기 단계 줄 + 오른쪽 설명 */
.map-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; padding: 14px 24px 20px; }
.map-main, .map-side { min-height: 0; overflow-y: auto; }
.map-cap { font-size: 13px; font-weight: 800; color: var(--muted); margin: 0 0 6px; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.stage { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 12px; font-size: 14px; font-weight: 700; color: var(--ink); }
.stage .n { color: var(--muted); font-weight: 600; font-size: 12px; margin-left: 6px; }
.stage.on { border-color: var(--navy); background: var(--navy-soft); color: var(--navy); }
.stage.hit { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
.tmap { display: grid; grid-template-columns: 170px repeat(3, minmax(0, 1fr)); gap: 8px; }
.tmap .colh { font-size: 15px; font-weight: 800; color: var(--navy); padding: 2px 4px; }
.tmap .colh small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
.tmap .rowh { font-size: 14px; font-weight: 800; color: var(--ink); padding: 8px 4px; display: flex; align-items: center; }
.tcell { text-align: left; border: 2px solid transparent; border-radius: 12px; padding: 10px 12px; min-height: 92px; font: inherit; transition: opacity .15s, box-shadow .15s; }
.tcell .tax { display: block; font-weight: 800; font-size: 16px; }
.tcell .pl { display: block; font-size: 13px; margin-top: 4px; line-height: 1.45; }
.tcell .rids { display: block; font-size: 12px; margin-top: 6px; font-weight: 700; opacity: .8; }
.tcell.t-none { background: var(--ok-soft); color: var(--ok); }
.tcell.t-pension { background: var(--navy-soft); color: var(--navy); }
.tcell.t-retire { background: #edf2ff; color: #364fc7; }
.tcell.t-other { background: var(--bad-soft); color: var(--bad); }
.tcell.t-unknown { background: #fff; color: var(--muted); border: 2px dashed var(--line); }
.tcell.sel { border-color: var(--ink); }
.tcell.hit { box-shadow: 0 0 0 3px var(--orange); }
.tcell.dim { opacity: .3; }
.map-note { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
.hitbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--orange-soft); border-radius: 10px; padding: 8px 12px; margin: 0 0 14px; font-size: 14px; }
.hitbar b { color: var(--orange-d); }
.hitbar .q { flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
.hitbar button { border: 1px solid var(--orange); background: #fff; color: var(--orange-d); border-radius: 8px; padding: 2px 10px; font-weight: 700; font-size: 13px; }
.mside { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 14px; }
.mside h4 { margin: 0 0 2px; font-size: 16px; color: var(--navy); }
.mside .big { font-size: 20px; font-weight: 800; margin: 6px 0 4px; }
.mside .sub { font-size: 13px; font-weight: 800; color: var(--muted); margin: 14px 0 6px; }
.mside .cand { font-size: 12px; color: var(--warn); font-weight: 700; }
.doclist { list-style: none; margin: 0; padding: 0; }
.doclist li { padding: 5px 0; border-top: 1px solid var(--line); }
.doclist li:first-child { border-top: 0; }
.doclist .t { font-weight: 700; }
.doclist .m { display: block; font-size: 12px; color: var(--muted); }
.graph-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 260px; gap: 16px; padding: 14px 24px 20px; }
.graph-box { position: relative; min-height: 0; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.graph-box svg { width: 100%; height: 100%; display: block; }
.graph-box .msg { position: absolute; inset: 0; display: grid; place-items: center; }
.graph-side { overflow-y: auto; min-height: 0; }
.legend { list-style: none; margin: 0 0 16px; padding: 0; font-size: 14px; }
.legend li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.legend .sw { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.legend .c { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.ninfo { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.ninfo h4 { margin: 0 0 4px; font-size: 17px; }
.ninfo ul { margin: 6px 0 0; padding-left: 1.1em; }
.ninfo .nsrc { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
.ninfo .nsrc h5 { margin: 0; font-size: 13px; }
.ninfo .nsrc li { margin: 6px 0; }
.ninfo .nq { font-size: 13px; line-height: 1.45; margin-top: 2px; }
.ninfo .nvia { font-size: 12px; }
svg .edge { fill: none; stroke: #b9c3d0; stroke-width: 1.1; transition: opacity .15s; }
svg .elabel { font-size: 11px; fill: var(--orange-d); font-weight: 700; display: none; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
svg .node { cursor: pointer; transition: opacity .15s; }
svg .node circle { stroke: #fff; stroke-width: 2; }
svg .node text { font-size: 14px; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 3px; font-weight: 600; }
svg .tlabel { font-size: 13px; font-weight: 800; }
svg.focus .node:not(.hl) { opacity: .15; }
svg.focus .edge:not(.hl) { opacity: .06; }
svg .edge.hl { stroke: var(--orange); stroke-width: 2.2; }
svg .elabel.hl { display: block; }
svg .node.pick circle { stroke: var(--orange); stroke-width: 4; }

/* ---------- 개발용 점검 결과 ---------- */
#selftest-out { position: fixed; left: 12px; bottom: 12px; z-index: 80; background: #0f1b2b; color: #e6edf6; font: 13px/1.5 Consolas, monospace; border-radius: 10px; padding: 10px 14px; max-width: min(640px, calc(100vw - 24px)); max-height: 50vh; overflow: auto; white-space: pre-wrap; }

/* 좁은 화면 — 발표는 1280×720 기준이지만 노트북 반쪽 창에서도 가로 스크롤 없이 */
@media (max-width: 980px) {
  body { overflow: auto; height: auto; }
  header.top { height: auto; flex-wrap: wrap; padding: 8px 16px; gap: 8px 16px; }
  nav.tabs { overflow-x: auto; max-width: 100%; }
  nav.tabs button { padding: 8px 10px; font-size: 15px; }
  main { min-height: calc(100vh - 110px); }
  section.tab { position: static; }
  section.tab.on { display: flex; flex-direction: column; }
  .side, .diy-form { width: auto; border-left: 0; border-right: 0; border-top: 1px solid var(--line); }
  .log { max-height: none; overflow: visible; padding: 14px 16px; }
  .composer { position: sticky; bottom: 0; padding: 10px 16px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .chip-q { flex: none; }
  .cards { grid-template-columns: 1fr; }
  .alerts-body { grid-template-columns: 1fr; padding: 14px 16px; }
  .alerts-body > div { overflow: visible; }
  .toolbar, .rules-wrap, .diy-out { padding-left: 16px; padding-right: 16px; }
  .graph-wrap { grid-template-columns: 1fr; padding: 14px 16px; }
  .map-wrap { grid-template-columns: 1fr; padding: 14px 16px; }
  .map-main, .map-side { overflow: visible; }
  .tmap { grid-template-columns: 92px repeat(3, minmax(0, 1fr)); gap: 5px; }
  .tmap .rowh, .tcell .pl { font-size: 12px; }
  .tcell { padding: 8px; min-height: 0; }
  .tcell .tax { font-size: 13px; }
  .graph-box { height: 70vh; }
  .boxes { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">연</span>연금 Agent <small>본선 시연</small></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="chat" class="on"><span class="k">1</span>상담</button>
    <button role="tab" data-tab="alerts"><span class="k">2</span>알림 미리받기</button>
    <button role="tab" data-tab="diy"><span class="k">3</span>DIY 설계</button>
    <button role="tab" data-tab="rules"><span class="k">4</span>규칙·개념 지도</button>
  </nav>
  <div class="server" id="server" title="서버 상태"><span class="dot"></span><span class="txt">확인 중</span></div>
</header>

<main>
  <!-- 1. 상담 -->
  <section class="tab on" id="tab-chat" role="tabpanel">
    <div class="chat-col">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="input-row">
          <textarea id="q" placeholder="연금 질문을 입력하세요 (Enter 보내기 · Shift+Enter 줄바꿈) — 주민번호·계좌번호·병명 같은 개인정보는 넣지 마세요" maxlength="2000"></textarea>
          <div class="mode-col">
            <label class="mode" title="빠른 모드: 생각을 짧게(약 12초) · 정밀 모드: 생각을 깊게, 더 꼼꼼히(약 21초)">
              <select id="mode"><option value="fast" selected>빠른 모드</option><option value="quality">정밀 모드</option></select>
            </label>
            <button class="btn primary" id="send">보내기</button>
          </div>
        </div>
      </div>
    </div>
    <aside class="side" id="side"></aside>
  </section>

  <!-- 2. 알림 미리받기 -->
  <section class="tab" id="tab-alerts" role="tabpanel">
    <div class="toolbar">
      <div class="field"><label for="profile">가상 고객</label><select id="profile"><option value="">불러오는 중…</option></select></div>
      <div class="field"><label for="today">기준일</label><input type="date" id="today"></div>
      <button class="btn primary" id="scan">점검하기</button>
      <button class="btn navy" id="pull">push 받기</button>
      <div class="psum" id="psum"></div>
    </div>
    <div class="alerts-body">
      <div id="alert-list"><p class="empty">고객과 기준일을 고르고 ‘점검하기’를 누르세요.</p></div>
      <div class="report-wrap" id="report-wrap"></div>
    </div>
  </section>

  <!-- 3. DIY 설계 -->
  <section class="tab" id="tab-diy" role="tabpanel">
    <form class="diy-form" id="diy-form" autocomplete="off">
      <div class="panel-title"><span class="bar"></span>내 정보</div>
      <div class="frow">
        <div class="field"><label for="d-kind">소득 기준</label>
          <select id="d-kind" title="직장인은 총급여, 그 밖에는 종합소득금액"><option value="총급여">총급여</option><option value="종합소득">종합소득</option></select></div>
        <div class="field"><label for="d-income">금액 <span class="unit">만 원</span></label><input type="number" id="d-income" min="0" step="100" value="5000"></div>
        <div class="field" style="flex:0 0 84px"><label for="d-age">나이</label><input type="number" id="d-age" min="19" max="90" value="40"></div>
      </div>
      <div class="sec-h"><label><input type="checkbox" id="d-cmp" checked>납입 조합 비교 <span class="unit">연간, 만 원</span></label><button type="button" class="btn small" id="add-combo">+ 조합 추가</button></div>
      <div id="combos"></div>
      <div class="sec-h"><label><input type="checkbox" id="d-pay" checked>수령 설계도 보기</label></div>
      <div id="pay-fields">
        <div class="frow">
          <div class="field"><label for="d-start">시작 나이</label><input type="number" id="d-start" min="55" max="90" value="60"></div>
          <div class="field"><label for="d-years">기간 <span class="unit">년</span></label><input type="number" id="d-years" min="1" max="40" value="10"></div>
          <div class="field"><label for="d-balance">평가액 <span class="unit">만 원</span></label><input type="number" id="d-balance" min="0" step="100" value="10000"></div>
        </div>
        <details class="adv" id="d-adv">
          <summary>재원 나누기 · 수익률(선택)</summary>
          <div class="frow" style="margin-top:8px">
            <div class="field"><label for="d-free">공제 안 받은 돈</label><input type="number" id="d-free" min="0" step="100" value="0"></div>
            <div class="field"><label for="d-retire">퇴직금</label><input type="number" id="d-retire" min="0" step="100" value="0"></div>

<script>

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

/** 만 원 → '148만 5천 원' — taxcalc.won 과 같은 모양(슬라이더·입력값 표시에만 쓴다). */
function won(man) {
  if (man == null || man === '' || !isFinite(man)) return '-';
  const neg = man < 0;
  const w = Math.round(Math.abs(Number(man)) * 10000);
  const eok = Math.floor(w / 1e8), rest = w % 1e8;
  const m = Math.floor(rest / 1e4), r = rest % 1e4;
  const parts = [];
  if (eok) parts.push(eok.toLocaleString('en-US') + '억');
  if (m) parts.push(m.toLocaleString('en-US') + '만');
  let out;
  if (r && r % 1000 !== 0) out = (parts.join(' ') + ' ' + r.toLocaleString('en-US') + '원').trim();
  else {
    if (r) parts.push((r / 1000) + '천');
    out = parts.length ? parts.join(' ') + ' 원' : '0원';
  }
  return (neg && out !== '0원' ? '-' : '') + out;
}
function pct(x) { return (Math.round(Number(x) * 100) / 100) + '%'; }
function docName(file) { return String(file || '').replace(/\.txt$/i, ''); }
/* 문서 제목 — GET /ontology/overview 의 docs 로 채운다. 아직 없으면 번호(doc39)로 보이고, 받은 뒤 칩을 고친다 */
const DOCS = {};
function docKey(file) { const f = String(file || ''); return /\.txt$/i.test(f) ? f : f + '.txt'; }
function docLabel(file) { const d = DOCS[docKey(file)]; return (d && d.title) || docName(file); }
function docChip(file) {

}
function refreshDocChips() {

}
function audLabel(a) {

  return a === '고객' ? '고객용' : a === '직원' ? '직원용' : a;
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function asList(v) { return Array.isArray(v) ? v : v == null || v === '' ? [] : [v]; }

/* =========================================================================
   마크다운 — 이스케이프 먼저, 그다음 제목·굵게·목록·표·코드만 태그로.
   입력의 '<' '>' '&' '"' "'" 는 전부 글자가 되므로 어떤 태그·속성도 들어올 수 없다.
   만드는 태그의 속성은 정렬(style)·번호 시작(start)뿐이고 둘 다 입력 글자가 아니라 고정값·숫자다.
   ========================================================================= */
function inline(t) {
  // t 는 이미 이스케이프된 한 줄. `코드` 를 먼저 떼어 두고(안의 ** 는 그대로) 나머지만 굵게를 바꾼다.
  return t.split(/(`[^`]+`)/).map((p, i) => {
    if (i % 2 === 1) return '<code>' + p.slice(1, -1) + '</code>';
    return p.replace(/\*\*(?=\S)(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/__(?=\S)(.+?)__/g, '<strong>$1</strong>');
  }).join('');
}
const RE_FENCE = /^\s*```/;
const RE_HEAD = /^\s*(#{1,6})\s+(.*)$/;
const RE_HR = /^\s*([-*_])(\s*\1){2,}\s*$/;
const RE_LI = /^(\s*)([-*+•]|\d{1,3}[.)])\s+(.*)$/;
const RE_QUOTE = /^\s*&gt;\s?/;
function isSep(l) { return l.includes('|') && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l); }
function cells(l) {
  let t = l.trim();
  if (t.startsWith('|')) t = t.slice(1);
  if (t.endsWith('|')) t = t.slice(0, -1);
  return t.split('|').map(c => c.trim());
}
function isTableStart(lines, i) { return lines[i].includes('|') && i + 1 < lines.length && isSep(lines[i + 1]); }

  const l = lines[i];
  return RE_FENCE.test(l) || RE_HEAD.test(l) || RE_HR.test(l) || RE_LI.test(l) || RE_QUOTE.test(l) || isTableStart(lines, i);
}
function renderList(items) {
  let out = '';
  const stack = [];
  for (const it of items) {
    const tag = it.ord ? 'ol' : 'ul';
    const open = () => {
      const st = it.ord && it.start > 1 ? ` start="${it.start}"` : '';
      out += `<${tag}${st}>`;
      stack.push({ ind: it.ind, tag });
    };
    if (!stack.length || it.ind > stack[stack.length - 1].ind) open();
    else {
      while (stack.length > 1 && it.ind < stack[stack.length - 1].ind) out += `</li></${stack.pop().tag}>`;
      out += '</li>';
      if (stack[stack.length - 1].tag !== tag) { out += `</${stack.pop().tag}>`; open(); }
    }

}
function md(src) {
  if (src == null || src === '') return '';
  const lines = esc(String(src).replace(/\r\n?/g, '\n')).split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if (!l.trim()) { i++; continue; }
    if (RE_FENCE.test(l)) {                                   // 코드 블록
      const buf = [];
      i++;
      while (i < lines.length && !RE_FENCE.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre><code>' + buf.join('\n') + '</code></pre>');

    }

    if (isTableStart(lines, i)) {                             // 표

      const sty = j => al[j] ? ` style="text-align:${al[j]}"` : '';

      out.push('<blockquote>' + buf.map(inline).join('<br>') + '</blockquote>');
      continue;
    }
    const buf = [lines[i++]];                                 // 문단 — 줄바꿈은 <br>
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines, i)) buf.push(lines[i++]);
    out.push('<p>' + buf.map(x => inline(x.trim())).join('<br>') + '</p>');
  }

}

/* =========================================================================
   서버 호출 — 같은 주소(서버가 /demo 로 이 파일을 낸다). 실패는 종류별로 나눈다.
   ========================================================================= */
class ApiError extends Error {
  constructor(kind, status, detail) { super(kind); this.kind = kind; this.status = status; this.detail = detail; }
}
async function api(path, { method = 'GET', body, timeout = 30000 } = {}) {
  const ctl = new AbortController();
  const tm = setTimeout(() => ctl.abort(), timeout);
  let res;
  try {
    res = await fetch(path, {
      method,
      headers: body !== undefined ? { 'Content-Type': 'application/json' } : undefined,
      body: body !== undefined ? JSON.stringify(body) : undefined,
      signal: ctl.signal,
    });
  } catch (e) {
    clearTimeout(tm);
    if (e && e.name === 'AbortError') throw new ApiError('timeout');
    setServer(false);
    throw new ApiError('offline');
  }
  clearTimeout(tm);
  setServer(true);
  if (!res.ok) {
    let d = '';
    try { d = await res.text(); } catch (e) { /* 무시 */ }
    throw new ApiError('http', res.status, d.slice(0, 300));
  }
  try { return await res.json(); } catch (e) { throw new ApiError('badjson'); }
}
function errText(e) {
  const k = e && e.kind;
  if (k === 'offline') return '서버 연결 안 됨';
  if (k === 'timeout') return '응답이 너무 오래 걸려 멈췄어요';
  if (k === 'http') {
    let why = '';
    try { const j = JSON.parse(e.detail || ''); why = typeof j.detail === 'string' ? j.detail : typeof j.error === 'string' ? j.error : ''; } catch (x) { /* 본문이 JSON 이 아님 */ }
    return `서버 오류 (${e.status})` + (why ? ': ' + why.slice(0, 160) : '');
  }
  if (k === 'badjson') return '서버 응답 형식 오류';
  return '화면 오류: ' + (e && e.message ? e.message : String(e));
}
function errNode(e) { return h('div', { class: 'offline' }, errText(e)); }
function setServer(ok) {
  const el = $('#server');
  if (!el) return;
  el.classList.toggle('ok', ok);
  el.classList.toggle('bad', !ok);
  $('.txt', el).textContent = ok ? '서버 연결됨' : '서버 연결 안 됨';
}

const KIND_TAG = { chat: '질문', diy: 'DIY', handoff: '상담', guide: 'MAPS' };

function doAction(a, btn) {
  const kind = a.kind || 'chat';

    let src = bot && bot._resp;
    if (src && !(src.calc && asList(src.calc.figures).length)) {
      const all = [...$$('#log .msg-bot')];
      const prev = all.slice(0, all.indexOf(bot)).reverse().find(n => n._resp && n._resp.calc && asList(n._resp.calc.figures).length);
      if (prev) src = prev._resp;
    }
    if (inChat) {
      $('#log').append(src ? handoffCard(src)
        : h('div', { class: 'sysnote' }, h('span', null, '상담 연결 표시됨 · ' + CENTER_TXT)));

    snack('상담 연결 표시됨 · ' + CENTER_TXT);
    return;
  }
  if (kind === 'diy') {
    switchTab('diy');
    let plan = a.payload;
    if (typeof plan === 'string') { try { plan = JSON.parse(plan); } catch (e) { plan = null; } }
    if (plan && typeof plan === 'object' && (plan.combos || plan.income || plan.payout)) {
      fillDiy(plan);
      runDiy();
    }
    return;
  }
  const q = typeof a.payload === 'string' && a.payload.trim() ? a.payload : a.label;
  switchTab('chat');
  if (q) ask(q);
}

function verifyClass(v) {
  const act = String(v.action || '');
  if (v.contradiction || /대체|상담|어긋/.test(act)) return 'bad';
  if ((v.unmatched && v.unmatched.length) || (act && act !== '통과')) return 'warn';
  return 'ok';
}

/** 답을 기다리는 동안의 오른쪽 패널 — /chat/progress 가 알려 준 지금까지의 단계, 지금 하는 일, 규칙 계산값(답과 대조 전).

}

async function ask(text) {
  const q = String(text || '').trim();
  if (!q || chat.busy) return;
  chat.lastQ = q;
  setBusy(true);
  const log = $('#log');
  const w = $('.welcome', log);
  if (w) w.remove();
  const userEl = h('div', { class: 'msg-user' }, h('div', { class: 'bubble' }, q));
  log.append(userEl);
  const secEl = h('span', { class: 'pill time num' }, '0.0초');
  const pendTxt = h('span', null, '규칙을 확인하고 문서를 찾아 답을 쓰고 있어요…');
  const pend = h('div', { class: 'msg-bot pending' },
    h('div', { class: 'bot-head' }, h('span', { class: 'avatar' }, '연'), h('span', { class: 'who' }, '연금 Agent'), secEl),
    h('div', { class: 'cards' }, h('div', { class: 'card result' }, h('span', { class: 'spinner' }), pendTxt)));
  log.append(pend);
  scrollLog();
  $('#side').replaceChildren(sideWaiting('0.0초'));
  const t0 = performance.now();
  const secNow = () => ((performance.now() - t0) / 1000).toFixed(1) + '초';
  clearInterval(chat.timer);
  chat.timer = setInterval(() => {
    const t = secNow();
    secEl.textContent = t;
    const ss = $('#side-sec');
    if (ss) ss.textContent = t;
  }, 100);
  // 실시간 단계 — 0.5초마다 지금까지의 단계·규칙 계산값을 묻는다(답 글자는 오지 않는다). 실패하면 지금 화면 그대로 둔다
  const rid = newRid();
  let polling = false, lastKey = '', shown = 0;
  clearInterval(chat.poll);
  chat.poll = setInterval(async () => {
    if (polling) return;
    polling = true;
    try {
      const p = await api('/chat/progress?id=' + encodeURIComponent(rid), { timeout: 3000 });
      const key = p && p.found ? JSON.stringify([p.steps, p.now, p.calc]) : '';
      if (key && key !== lastKey && chat.poll && pend.isConnected) {
        lastKey = key;
        if (p.now) pendTxt.textContent = String(p.now) + '…';
        $('#side').replaceChildren(sideLive(p, secNow(), shown));
        shown = asList(p.steps).length;
      }
    } catch (e) { /* 진행 표시는 없어도 된다 */ }
    finally { polling = false; }
  }, 500);
  try {
    const modeEl = document.getElementById('mode');
    const body = { question: q, mode: (modeEl && modeEl.value) || 'fast', request_id: rid };
    if (chat.session) body.session_id = chat.session;
    const r = await api('/chat', { method: 'POST', body, timeout: 300000 });
    clearInterval(chat.poll);
    chat.poll = null;
    if (r.session_id) chat.session = r.session_id;
    chat.turns++;
    if (typeof r.elapsed !== 'number') r.elapsed = (performance.now() - t0) / 1000;
    const node = renderBot(r);
    pend.replaceWith(node);
    selectBot(node);
    log.scrollTop = Math.max(0, userEl.offsetTop - 8);     // 답은 길 수 있다 — 결론(맨 위)부터 보이게
  } catch (e) {
    pend.replaceWith(h('div', { class: 'err-block' }, errNode(e)));
    scrollLog();
    $('#side').replaceChildren(h('div', null, h('div', { class: 'panel-title' }, h('span', { class: 'bar' }), '처리 단계'), errNode(e)));
  } finally {
    clearInterval(chat.timer);
    clearInterval(chat.poll);
    chat.poll = null;
    setBusy(false);
  }
}

async function newChat() {
  if (chat.busy) return;
  chat.session = null;
  chat.turns = 0;
  chat.lastQ = '';
  $('#log').replaceChildren(welcomeNode());
  $('#side').replaceChildren(sideIdle());
  $('#q').value = '';
  try {
    const r = await api('/session', { method: 'POST' });
    chat.session = (r && r.session_id) || null;
    $('#side').replaceChildren(sideIdle());
  } catch (e) {
    $('#side').replaceChildren(sideIdle(), errNode(e));
  }
}

function initChat() {
  const chips = $('#chips');
  // 시연 장면 버튼은 기본으로 숨긴다(10-13 사용자: 다른 사람들이 직접 물어보며 시험 중). 발표 때는 /demo?scenes=1 로 연다
  const showScenes = new URLSearchParams(location.search).has('scenes');
  for (const sc of showScenes ? SCENES : []) {
    chips.append(h('button', { type: 'button', class: 'chip-q', title: sc.q || '알림 미리받기 탭으로', 'data-tab': sc.tab || null,
      onclick: () => {
        if (sc.tab) { switchTab(sc.tab); if (sc.tab === 'alerts') scanWhenReady(); return; }
        if (sc.after) {
          const prev = SCENES.find(x => x.tag === sc.after);
          if (!prev || chat.lastQ !== prev.q) { snack(`'${sc.after}' 버튼을 먼저 눌러 주세요 — 그 답에 이어지는 질문이에요`); return; }
        }
        ask(sc.q);
      } }, h('b', null, sc.tag), sc.label));
  }
  chips.append(h('button', { type: 'button', class: 'chip-q', title: '대화 기억을 지우고 새로 시작', onclick: newChat }, h('b', null, '↺'), '새 대화'));
  const ta = $('#q');
  ta.addEventListener('keydown', e => {

/* =========================================================================
   3. DIY 설계 — 계산은 서버(diy.simulate)가 한다. 화면은 입력을 모으고 결과를 나란히 보여준다.
   ========================================================================= */
const COMBO_MAX = 3, COMBO_MIN = 2, SLIDER_MAX = 1800, SLIDER_STEP = 50;
function comboNode(c) {
  const node = h('div', { class: 'combo' });
  const name = h('input', { type: 'text', value: c.name || '', maxlength: 12, 'aria-label': '조합 이름' });
  const sum = h('span', { class: 'sum' });
  const rows = [['연금저축', 'savings'], ['IRP', 'irp']].map(([lab, key]) => {
    const rng = h('input', { type: 'range', min: 0, max: SLIDER_MAX, step: SLIDER_STEP, value: c[key] || 0, 'data-k': key, 'aria-label': lab });
    const val = h('span', { class: 'val' });
    const upd = () => { val.textContent = won(+rng.value); updSum(); };
    rng.addEventListener('input', upd);
    return { el: h('div', { class: 'srow' }, h('span', null, lab), rng, val), upd };
  });
  function updSum() {
    const t = $$('input[type=range]', node).reduce((a, x) => a + (+x.value), 0);
    sum.replaceChildren('합계 ', h('b', { class: 'num' }, won(t)));
  }
  const x = h('button', { type: 'button', class: 'x', title: '조합 삭제', 'aria-label': '조합 삭제', onclick: () => {
    if ($$('#combos .combo').length <= COMBO_MIN) return;
    node.remove(); updComboButtons();
  } }, '×');
  node.append(h('div', { class: 'ch' }, name, sum, x), ...rows.map(r => r.el));
  rows.forEach(r => r.upd());
  return node;
}
function setCmp(on) {
  $('#d-cmp').checked = on;
  $('#combos').hidden = !on;
  $('#add-combo').hidden = !on;
}
function updComboButtons() {
  const n = $$('#combos .combo').length;
  $('#add-combo').disabled = n >= COMBO_MAX;
  for (const b of $$('#combos .combo .x')) b.disabled = n <= COMBO_MIN;
}
function setCombos(list) {
  $('#combos').replaceChildren(...list.slice(0, COMBO_MAX).map(comboNode));
  updComboButtons();
}
function numOr(el, d) { const v = el.value.trim(); return v === '' || !isFinite(+v) ? d : +v; }
function updCreditLine() {
  const bal = numOr($('#d-balance'), 0), fr = numOr($('#d-free'), 0), re = numOr($('#d-retire'), 0);
  const cr = Math.max(0, bal - fr - re);
  $('#credit-line').textContent = `공제받은 돈·수익 = 평가액 − 공제 안 받은 돈 − 퇴직금 = ${won(cr)}` + (fr + re > bal ? ' (재원 합이 평가액보다 커요)' : '');
}
function diyPlan() {
  const plan = {
    income: { kind: $('#d-kind').value, v: numOr($('#d-income'), 0) },
    age: numOr($('#d-age'), 40),
  };
  if ($('#d-cmp').checked) {
    plan.combos = $$('#combos .combo').map((c, k) => ({
      name: $('input[type=text]', c).value.trim() || String.fromCharCode(65 + k),
      savings: +$('input[data-k=savings]', c).value,
      irp: +$('input[data-k=irp]', c).value,
    }));
  }
  if ($('#d-pay').checked) {
    const bal = numOr($('#d-balance'), 0), fr = numOr($('#d-free'), 0), re = numOr($('#d-retire'), 0);
    const eff = $('#d-eff').value.trim();
    plan.payout = {
      start_age: numOr($('#d-start'), 60), years: numOr($('#d-years'), 10), balance: bal,
      free: fr, retire: re, credit: Math.max(0, bal - fr - re),
      eff: eff === '' || !isFinite(+eff) ? null : +eff,
      return_rate: numOr($('#d-ret'), 0) / 100,      // 화면은 %, 서버는 비율(0.03 = 3%)
    };
  }
  return plan;
}
function fillDiy(plan) {
  if (plan.income) {
    if (plan.income.kind) $('#d-kind').value = plan.income.kind === '종합소득' ? '종합소득' : '총급여';
    if (plan.income.v != null) $('#d-income').value = plan.income.v;
  }
  if (plan.age != null) $('#d-age').value = plan.age;
  // 알림·상담에서 온 설계값은 그 모양 그대로 — 조합이 없으면 조합 비교를 끄고, 수령 설계가 없으면 수령 설계를 끈다
  const hasC = Array.isArray(plan.combos) && plan.combos.length > 0;
  if (hasC) {
    const cs = plan.combos.slice(0, COMBO_MAX);
    while (cs.length < COMBO_MIN) cs.push({ name: String.fromCharCode(65 + cs.length), savings: 0, irp: 0 });
    setCombos(cs);
  }
  setCmp(hasC);
  const p = plan.payout;
  $('#d-pay').checked = !!p;
  $('#pay-fields').hidden = !p;
  if (p) {
    if (p.start_age != null) $('#d-start').value = p.start_age;
    if (p.years != null) $('#d-years').value = p.years;
    if (p.balance != null) $('#d-balance').value = p.balance;
    $('#d-free').value = p.free || 0;
    $('#d-retire').value = p.retire || 0;
    $('#d-eff').value = p.eff == null ? '' : p.eff;
    $('#d-ret').value = p.return_rate ? Math.round(p.return_rate * 1000) / 10 : 0;
    if (p.free || p.retire || p.eff != null || p.return_rate) $('#d-adv').open = true;
    updCreditLine();
  }
}
async function runDiy() {
  const btn = $('#diy-go');
  const out = $('#diy-out');
  if (!$('#d-cmp').checked && !$('#d-pay').checked) {
    out.replaceChildren(h('p', { class: 'empty' }, '납입 조합 비교나 수령 설계 중 하나는 켜 주세요.'));

  btn.disabled = true;
  out.replaceChildren(h('p', { class: 'empty' }, h('span', { class: 'spinner', style: 'display:inline-block;vertical-align:middle;margin-right:8px' }), '계산하는 중…'));
  try {
    const r = await api('/diy', { method: 'POST', body: diyPlan() });

}

/* DIY 결과를 보며 바로 묻기(10-13 교수님 피드백: "DIY에서 보다가 질문은 못하는거야?").
   지금 설계값을 질문 앞에 붙여 /chat 으로 보낸다 — 상담 탭과 같은 대화 기억·4칸 답. 조합 문장은 규칙 계산(조합 비교)이 읽는 꼴로 쓴다 */
function diyContext(plan) {
  const p = plan || diyPlan();
  const parts = [`${p.income.kind === '종합소득' ? '종합소득' : '총급여'} ${won(p.income.v)}`, `나이 ${p.age}세`];
  const combo = c => `연금저축 ${won(c.savings)}` + (c.irp ? ` + IRP ${won(c.irp)}` : '');
  if (asList(p.combos).length) parts.push(asList(p.combos).map(combo).join('이랑 ') + (p.combos.length > 1 ? ' 넣는 거 비교' : ' 넣는 경우'));
  if (p.payout) parts.push(`수령 설계 ${p.payout.start_age}세부터 ${p.payout.years}년(평가액 ${won(p.payout.balance)})`);
  return parts.join(', ') + ' 기준으로 질문:';
}
function diyQaNode() {
  const input = h('input', { type: 'text', class: 'diy-q', maxlength: 300, 'aria-label': 'DIY 설계로 질문하기',
    placeholder: '이 설계로 궁금한 점을 물어보세요 (예: 두 조합 차이가 왜 나요? IRP는 중간에 못 빼요?)' });
  const list = h('div', { class: 'diy-answers' });
  const btn = h('button', { type: 'button', class: 'btn primary small' }, '질문하기');
  const send = async () => {
    const q = input.value.trim();
    if (!q || chat.busy) return;
    const ctx = diyContext();
    input.value = '';
    setBusy(true);
    btn.disabled = true;
    const pend = h('div', { class: 'msg-bot pending' }, h('div', { class: 'cards' }, h('div', { class: 'card result' }, h('span', { class: 'spinner' }), '설계값과 함께 답을 쓰고 있어요…')));
    list.prepend(h('div', { class: 'diy-turn' }, h('div', { class: 'msg-user' }, h('div', { class: 'bubble' }, q)),
      h('p', { class: 'diy-ctx' }, '함께 보낸 설계값: ' + ctx.replace(/ 기준으로 질문:$/, '')), pend));
    const t0 = performance.now();
    try {
      const body = { question: `${ctx} ${q}`, mode: ($('#mode') && $('#mode').value) || 'fast' };
      if (chat.session) body.session_id = chat.session;
      const r = await api('/chat', { method: 'POST', body, timeout: 300000 });
      if (r.session_id) chat.session = r.session_id;
      if (typeof r.elapsed !== 'number') r.elapsed = (performance.now() - t0) / 1000;
      pend.replaceWith(renderBot(r));
    } catch (e) {
      pend.replaceWith(h('div', { class: 'err-block' }, errNode(e)));
    } finally { setBusy(false); btn.disabled = false; }
  };
  btn.addEventListener('click', send);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send(); } });
  return h('div', { class: 'diy-qa' },
    h('div', { class: 'panel-title' }, h('span', { class: 'bar' }), '이 설계로 질문하기'),
    h('div', { class: 'diy-qrow' }, input, btn),
    h('p', { class: 'hint' }, '지금 설계값(소득·나이·조합)이 질문에 함께 붙어, 상담 탭과 같은 방식(결과·근거·가정·다음 행동)으로 답해요.'),
    list);
}

/* DIY 결과(diy.simulate) 그리기. 금액 글자는 서버가 taxcalc.won 으로 만든 text.* 를 먼저 쓰고, 없을 때만 won() 으로.
   조합은 입력 순서대로 같은 모양의 열로 둔다 — 어느 쪽도 색·굵기로 띄우지 않는다('추천' 표시 없음). */
function tv(o, k) {
  const t = o && o.text && o.text[k];
  if (t != null && t !== '') return String(t);
  const v = o ? o[k] : null;
  return v == null ? '-' : typeof v === 'number' ? won(v) : String(v);
}
function factChip(k, v) { return h('div', { class: 'fig' }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v)); }

    ['올해 세액공제액', c => c.refund == null ? '소득 필요' : tv(c, 'refund'), null, true],
    ['공제 못 받는 금액 (나중에 비과세)', c => tv(c, 'excluded')],
  ];
  if (anyYears) {
    rows.push([`수령 전 ${yrs}년 누적 세액공제`, c => c.refund_total == null ? '-' : tv(c, 'refund_total')]);
    rows.push([`수령 전 ${yrs}년 누적 비과세 쌓임`, c => tv(c, 'excluded_total')]);
  }
  return h('table', { class: 'cmp' },
    h('thead', null, h('tr', null, h('th', { style: 'text-align:left' }, '항목'), combos.map((c, k) => h('th', null, '조합 ' + (c.name || String.fromCharCode(65 + k)))))),
    h('tbody', null,
      rows.map(([lab, f, warnIf, hl]) => h('tr', null, h('th', null, lab),
        combos.map(c => h('td', { class: (hl ? 'hl ' : '') + (warnIf && warnIf(c) ? 'warnc' : '') }, f(c) + (warnIf && warnIf(c) ? ` (한도 초과 ${won(c.over_cap)})` : ''))))),
      h('tr', null, h('th', null, '근거'), combos.map(c => h('td', { style: 'text-align:left' }, asList(c.rule_ids).map(ruleChip), asList(c.docs).map(d => docChip(d)))))));
